name: Test and deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: afterglow-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # actions/checkout@v6
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      # actions/setup-python@v6
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12'
      - name: Set up Node.js
        # actions/setup-node@v6
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Run product tests
        run: python -m unittest discover -s tests -p 'test_*.py' -q
      - name: Build and verify frontend
        run: |
          npm --prefix frontend ci
          npm --prefix frontend run build
          npm --prefix frontend run verify:parity
      - name: Build release bundle
        run: python scripts/build_release.py "$RUNNER_TEMP/afterglow-release.tar.gz"
      - name: Check deployment secrets
        id: deploy-check
        run: |
          if [ -n "${{ secrets.AFTERGLOW_DEPLOY_KEY }}" ] && [ -n "${{ vars.AFTERGLOW_HOST }}" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::未配置部署凭据（AFTERGLOW_DEPLOY_KEY / AFTERGLOW_HOST），跳过生产部署。"
          fi
      - name: Deploy main to production
        if: steps.deploy-check.outputs.ready == 'true' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          SSH_KEY: ${{ secrets.AFTERGLOW_DEPLOY_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.AFTERGLOW_KNOWN_HOSTS }}
          DEPLOY_HOST: ${{ vars.AFTERGLOW_HOST }}
          DEPLOY_USER: ${{ vars.AFTERGLOW_USER }}
          DEPLOY_PORT: ${{ vars.AFTERGLOW_PORT }}
          HEALTH_URL: ${{ vars.AFTERGLOW_HEALTH_URL }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SSH_KEY"
          test -n "$SSH_KNOWN_HOSTS"
          test -n "$DEPLOY_HOST"
          test -n "$DEPLOY_USER"
          test -n "$HEALTH_URL"
          install -d -m 700 "$RUNNER_TEMP/afterglow-ssh"
          trap 'rm -rf "$RUNNER_TEMP/afterglow-ssh"' EXIT
          printf '%s\n' "$SSH_KEY" > "$RUNNER_TEMP/afterglow-ssh/key"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$RUNNER_TEMP/afterglow-ssh/known_hosts"
          chmod 600 "$RUNNER_TEMP/afterglow-ssh/"*
          ssh -T -p "${DEPLOY_PORT:-22}" \
            -i "$RUNNER_TEMP/afterglow-ssh/key" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/afterglow-ssh/known_hosts" \
            -o ConnectTimeout=15 -o ServerAliveInterval=15 \
            "$DEPLOY_USER@$DEPLOY_HOST" "deploy $GITHUB_SHA" < "$RUNNER_TEMP/afterglow-release.tar.gz"
          curl --fail --silent --show-error --retry 3 "$HEALTH_URL" > "$RUNNER_TEMP/health.json"
          python -c 'import json,sys; h=json.load(open(sys.argv[1])); assert h.get("ok") is True and h.get("local_open_access") is False; print("Public health verified")' "$RUNNER_TEMP/health.json"
